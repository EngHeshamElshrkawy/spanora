<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff6e8">
    <meta name="description" content="Spanora is getting ready to make its entrance. Our new home is under construction.">
    <title>Spanora — Coming soon</title>
    <style>
      :root {
        color-scheme: light;
        --cream: #fff6e8;
        --peach: #ffe3c4;
        --rose: #f0455c;
        --red: #b80f2e;
        --gold: #ffd25a;
        --caramel: #c97a12;
        --ink: #2b1b1f;
        --muted: #735b53;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 12% 88%, rgb(242 154 46 / 12%), transparent 32rem),
          radial-gradient(ellipse at 92% 6%, rgb(240 69 92 / 9%), transparent 30rem),
          var(--cream);
        color: var(--ink);
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      }

      .page {
        width: min(100% - 3rem, 1120px);
        min-height: min(720px, calc(100vh - 3rem));
        margin: 1.5rem auto;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.35rem 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.72rem;
        color: var(--ink);
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-decoration: none;
      }

      .brand-mark {
        width: 2rem;
        height: 2rem;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, var(--rose), var(--red));
        color: var(--cream);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.2rem;
        font-style: italic;
        font-weight: 700;
        letter-spacing: 0;
      }

      .top-note {
        color: var(--muted);
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      main {
        position: relative;
        flex: 1;
        min-height: 540px;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        align-items: center;
        isolation: isolate;
      }

      .copy {
        position: relative;
        z-index: 1;
        padding: 4rem 0 5rem;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0 0 1.65rem;
        color: var(--red);
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 1.8rem;
        height: 1px;
        background: var(--caramel);
        content: "";
      }

      h1 {
        max-width: 660px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.7rem, 8vw, 7rem);
        font-weight: 400;
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      h1 span {
        display: block;
        color: var(--red);
        font-style: italic;
      }

      .message {
        max-width: 430px;
        margin: 2rem 0 0;
        color: var(--muted);
        font-size: clamp(1rem, 1.6vw, 1.12rem);
        line-height: 1.8;
      }

      .signature {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        margin-top: 2.8rem;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.95rem;
        font-style: italic;
      }

      .signature::before {
        width: 2.3rem;
        height: 1px;
        background: var(--gold);
        content: "";
      }

      .art {
        position: absolute;
        z-index: -1;
        top: 50%;
        right: -2.2rem;
        width: min(59%, 610px);
        aspect-ratio: 1;
        transform: translateY(-49%);
      }

      .art::before {
        position: absolute;
        inset: 10%;
        border: 1px solid rgb(201 122 18 / 25%);
        border-radius: 50%;
        content: "";
      }

      .art::after {
        position: absolute;
        inset: 17%;
        border: 1px solid rgb(184 15 46 / 15%);
        border-radius: 50%;
        content: "";
      }

      .art svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 24px 26px rgb(89 39 22 / 12%));
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.35rem 0;
        border-top: 1px solid rgb(43 27 31 / 12%);
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .footer-flourish {
        color: var(--caramel);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.2rem;
      }

      @media (min-width: 1200px) {
        .art {
          right: -4.5rem;
        }
      }

      @media (max-width: 700px) {
        .page {
          width: min(100% - 2.25rem, 520px);
          min-height: calc(100svh - 1.5rem);
          margin: 0.75rem auto;
        }

        .topbar {
          padding: 1rem 0;
        }

        .top-note {
          max-width: 120px;
          text-align: right;
          line-height: 1.5;
        }

        main {
          min-height: 690px;
          grid-template-columns: 1fr;
          align-content: start;
        }

        .copy {
          padding: 3rem 0 1rem;
        }

        h1 {
          font-size: clamp(3.7rem, 16vw, 6rem);
        }

        .message {
          max-width: 370px;
          margin-top: 1.35rem;
        }

        .signature {
          margin-top: 1.5rem;
        }

        .art {
          top: auto;
          right: -0.8rem;
          bottom: 0;
          width: min(88%, 390px);
          transform: none;
        }

        footer {
          font-size: 0.62rem;
          letter-spacing: 0.04em;
        }
      }

      @media (max-width: 380px) {
        .page {
          width: calc(100% - 1.5rem);
        }

        .brand {
          font-size: 0.78rem;
        }

        main {
          min-height: 650px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .art svg {
          animation: arrive 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(14px) rotate(-4deg);
          }
          to {
            opacity: 1;
            transform: translateY(0) rotate(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Spanora home">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>SPANORA</span>
        </a>
      </header>

      <main>
        <section class="copy" aria-labelledby="headline">
          <p class="eyebrow">The curtain is almost up</p>
          <h1 id="headline">Spanora is <span>currently</span> under construction.</h1>
          <p class="message">We’re putting the finishing touches on something special. Check back soon — the next act is worth the wait.</p>
          <p class="signature">See you when the lights come up.</p>
        </section>

        <div class="art" aria-hidden="true">
          <svg viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="fan" x1="185" y1="84" x2="365" y2="242" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFD25A"/>
                <stop offset="1" stop-color="#F29A2E"/>
              </linearGradient>
              <linearGradient id="ribbon" x1="173" y1="145" x2="343" y2="450" gradientUnits="userSpaceOnUse">
                <stop stop-color="#F0455C"/>
                <stop offset="1" stop-color="#B80F2E"/>
              </linearGradient>
            </defs>
            <path d="M200 221 178 106c48-9 97 18 113 64l-91 51Z" fill="url(#fan)"/>
            <g stroke="#C97A12" stroke-linecap="round" stroke-width="4">
              <path d="m200 221-22-115M200 221l2-119M200 221l25-112M200 221l48-100M200 221l68-82"/>
            </g>
            <path d="M178 106c48-9 97 18 113 64" stroke="#B80F2E" stroke-linecap="round" stroke-width="6"/>
            <path d="M192 227c-68-75-22-158 75-138 43 9 65 40 86 83" stroke="url(#ribbon)" stroke-linecap="round" stroke-width="30"/>
            <path d="M332 260c86 38 101 133 32 177-35 23-80 4-112 23-31 18-64 27-91 3 45-12 70-38 76-68 8-42-6-73-30-101" fill="url(#ribbon)"/>
            <g stroke="#FFE3C4" stroke-linecap="round" stroke-opacity=".8" stroke-width="6">
              <path d="M348 335c25 24 30 53 16 78"/>
              <path d="M304 353c20 24 22 50 8 76"/>
              <path d="M263 367c14 21 13 47-3 68"/>
            </g>
            <circle cx="300" cy="174" r="16" fill="#2B1B1F"/>
            <path d="M294 155 278 138c18-15 39-14 54 1l-24 17" fill="url(#fan)"/>
            <g stroke="#C97A12" stroke-linecap="round" stroke-width="3">
              <path d="m294 155-13-17M294 155l2-21M294 155l16-18"/>
            </g>
            <circle cx="326" cy="169" r="8" fill="#F0455C"/>
            <circle cx="339" cy="173" r="8" fill="#D92141"/>
            <circle cx="332" cy="184" r="8" fill="#B80F2E"/>
            <circle cx="332" cy="175" r="4" fill="#FFC233"/>
          </svg>
        </div>
      </main>

      <footer>
        <span>Made with a little extra warmth</span>
        <span class="footer-flourish" aria-hidden="true">✳</span>
        <span>Something lovely is taking shape</span>
      </footer>
    </div>
  </body>
</html>
